
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eadccf">
<meta name="description" content="Muslima Boutique - أناقة الشالات والخمارات">
<title>Muslima Boutique</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #bd2866;
  --pink-dark: #8f1749;
  --gold: #bd9b68;
  --ink: #292126;
  --muted: #796b70;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 26px 16px;
  color: var(--ink);
  font-family: "Cairo", sans-serif;
  background:
    radial-gradient(circle at 12% 15%, rgba(189,40,102,.13), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(189,40,102,.10), transparent 30%),
    linear-gradient(135deg, #e8d9cb, #f8f2ec 55%, #e9d8ca);
}

.card {
  width: min(100%, 430px);
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 38px 29px 30px;
  text-align: center;
  border: 1px solid rgba(189,40,102,.20);
  border-radius: 30px;
  background: linear-gradient(155deg, #fff, #f9efe8);
  box-shadow: 0 25px 65px rgba(67,39,49,.17);
}

/* الإطار الداخلي */
.card::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px solid rgba(189,155,104,.55);
  border-radius: 21px;
  pointer-events: none;
  z-index: -1;
}

/* زخارف هندسية متناظرة في الزوايا */
.card::after {
  content: "";
  position: absolute;
  inset: 19px;
  pointer-events: none;
  z-index: -1;
  background:
    linear-gradient(var(--pink),var(--pink)) left top / 24px 1px no-repeat,
    linear-gradient(var(--pink),var(--pink)) left top / 1px 24px no-repeat,
    linear-gradient(var(--pink),var(--pink)) right top / 24px 1px no-repeat,
    linear-gradient(var(--pink),var(--pink)) right top / 1px 24px no-repeat,
    linear-gradient(var(--pink),var(--pink)) left bottom / 24px 1px no-repeat,
    linear-gradient(var(--pink),var(--pink)) left bottom / 1px 24px no-repeat,
    linear-gradient(var(--pink),var(--pink)) right bottom / 24px 1px no-repeat,
    linear-gradient(var(--pink),var(--pink)) right bottom / 1px 24px no-repeat;
  opacity: .55;
}

.logo-wrap {
  width: 190px;
  height: 190px;
  margin: 0 auto 18px;
  padding: 8px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(145deg, #fff, #ead9df);
  box-shadow:
    0 12px 28px rgba(117,42,75,.15),
    0 0 0 1px rgba(189,40,102,.12);
}

.logo-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

h1 {
  margin: 5px 0 2px;
  color: var(--pink-dark);
  font-family: "Playfair Display", "Cairo", serif;
  font-size: clamp(29px, 8vw, 36px);
  line-height: 1.25;
  letter-spacing: .3px;
}

.tagline {
  margin: 8px 0 25px;
  color: var(--pink-dark);
  font-size: 16px;
  font-weight: 700;
}

.ornament {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 auto 24px;
  width: 72%;
  color: var(--gold);
  font-size: 19px;
}

.ornament::before,
.ornament::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(90deg, transparent, var(--gold));
}

.ornament::after {
  transform: scaleX(-1);
}

.links {
  display: grid;
  gap: 16px;
}

.social {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  min-height: 61px;
  padding: 13px 18px;
  border-radius: 17px;
  color: #fff;
  text-decoration: none;
  font-size: 17px;
  font-weight: 800;
  transition: transform .18s ease, filter .18s ease;
}

.social:hover {
  transform: translateY(-3px);
  filter: brightness(1.05);
}

.social:active {
  transform: translateY(3px);
}

.facebook {
  background: linear-gradient(135deg,#287be5,#1455a8);
  box-shadow: 0 7px 0 #103e7c, 0 13px 22px rgba(20,75,145,.2);
}

.instagram {
  background: linear-gradient(110deg,#7438a8 0%,#c13584 48%,#ed6a43 100%);
  box-shadow: 0 7px 0 #7e285f, 0 13px 22px rgba(160,48,105,.2);
}

.social svg {
  width: 27px;
  height: 27px;
  flex: 0 0 27px;
  fill: currentColor;
}

.social .ig-stroke {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.3;
}

.footer {
  margin: 27px 0 0;
  color: #9a858e;
  font-size: 11px;
  letter-spacing: 1.5px;
  direction: ltr;
}

@media (max-width: 360px) {
  .card { padding: 32px 22px 26px; }
  .logo-wrap { width: 170px; height: 170px; }
  .social { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  .social { transition: none; }
}
</style>
</head>

<body>
<main class="card">

  <div class="logo-wrap">
    <img src="logo.png" alt="شعار Muslima Boutique">
  </div>

  <h1>Muslima Boutique</h1>

  <p class="tagline">أناقة الشالات والخمارات</p>

  <div class="ornament" aria-hidden="true">✦</div>

  <nav class="links" aria-label="روابط التواصل الاجتماعي">

    <a class="social facebook"
       href="https://www.facebook.com/share/1CuFujHuZZ/"
       target="_blank" rel="noopener noreferrer">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13.4 21v-8.2h2.8l.4-3.2h-3.2V7.55c0-.93.26-1.56 1.6-1.56h1.7V3.12A22 22 0 0 0 14.2 3c-2.48 0-4.18 1.52-4.18 4.31v2.29H7.2v3.2h2.82V21z"/>
      </svg>

      <span>تابعونا على Facebook</span>
    </a>

    <a class="social instagram"
       href="https://www.instagram.com/__muslima__boutique/"
       target="_blank" rel="noopener noreferrer">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect class="ig-stroke" x="3" y="3" width="18" height="18" rx="5"/>
        <circle class="ig-stroke" cx="12" cy="12" r="4.2"/>
        <circle cx="17.6" cy="6.7" r="1.25"/>
      </svg>

      <span>تابعونا على Instagram</span>
    </a>

  </nav>

  <p class="footer">ELEGANCE • MODESTY • BEAUTY</p>

</main>
</body>
</html>
